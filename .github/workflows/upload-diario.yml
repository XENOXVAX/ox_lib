# Guarda este archivo como .github/workflows/upload-diario.yml en tu repositorio.
#
# Antes de usarlo:
# 1. Sube tu repo a GitHub (privado, para que nadie mas vea tus clips/credenciales).
# 2. En Settings > Secrets and variables > Actions, crea dos secrets:
#    CLIENT_SECRET_JSON  -> el contenido completo de tu client_secret.json
#    TOKEN_JSON           -> el contenido completo de tu token.json (generado localmente
#                             la primera vez que corres el script, paso 3 de la guia)
# 3. Ajusta la hora del cron a cuando quieras que se dispare (esta usando UTC).

name: Subida diaria a YouTube

on:
  schedule:
    - cron: "0 8 * * *"   # todos los dias a las 08:00 UTC
  workflow_dispatch:        # tambien te deja correrlo manualmente desde GitHub

jobs:
  subir-clips:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install google-auth-oauthlib google-api-python-client

      - name: Restaurar credenciales
        run: |
          echo '${{ secrets.CLIENT_SECRET_JSON }}' > client_secret.json
          echo '${{ secrets.TOKEN_JSON }}' > token.json

      - name: Subir clips de hoy
        run: python upload_youtube.py
